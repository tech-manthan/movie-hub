# Cine Kahani settings. Secrets (API keys) live in .env, never here.
channel:
  name: Cine Kahani
  studio_credit: ""          # optional extra credit line, e.g. a studio or editor name

paths:
  projects: projects
  music: music
  services: services
  logs: logs

languages: [hi, en]          # narration languages
hindi_script: devanagari     # devanagari | hinglish (Latin letters)

tmdb:
  # TMDB metadata language per narration language
  locale: {hi: hi-IN, en: en-US}
  max_age_days: 30           # refresh cached metadata older than this

llm:
  # Scripts are written by the Claude Code CLI (`claude -p`), prompt sent on stdin.
  command: [claude, -p]
  model: null                # e.g. sonnet; null = CLI default
  timeout_s: 900
  retries: 2                 # extra attempts after a failure
  retry_delay_s: 5

script:
  require_approval: true     # later phases refuse an unapproved script
  words_per_minute: {en: 150, hi: 140}
  target_minutes:            # default length per format
    review: 8
    ending_explained: 8
    things_you_missed: 7
    cast_facts: 6
    should_you_watch: 5
    comparison: 8
  length_tolerance: [0.6, 1.4]   # accepted share of the target word count

# Used from Phase 3 on. Kept here so limits are config, not code.
guardrails:
  trailer:
    enabled: true
    max_snippet_seconds: 3
    max_share_of_runtime: 0.20
    max_continuous_seconds: 3   # never a long unbroken section
    min_narration_share: 0.80
  vary_formats: true

cooldown:
  between_chunks_s: 20       # pause between heavy chunks (fanless MacBook Air)
  check_thermal: true

# ---- Phase 2: narration (VoiceStudio runs as its own app; we only call its local API) ----
voice:
  base_url: http://127.0.0.1:3900
  engine: voxcpm2            # Apache-2.0 weights. Do NOT use omnivoice on a monetized channel (non-commercial).
  speed: 1.0
  seed: 42
  max_chunk_chars: 350       # text is spoken in chunks; each one is cached
  pause_ms: {paragraph: 450, section: 900}
  # `cinekahani voice setup` stores your voice profile ids in config/studio.local.yaml

# ---- Phase 3: video ----
video:
  width: 1920
  height: 1080
  fps: 30
  encoder: auto              # auto = Mac hardware encoder (h264_videotoolbox) when available, else libx264
  shot_seconds: [5, 9]
  intro_seconds: 3
  outro_seconds: 5
  batch_size: 6              # shots rendered before a cooldown pause
  subtitles:
    enabled: true
    font: {en: Arial, hi: Kohinoor Devanagari}
    size: 54
  music:
    volume: 0.10
    allowed_licenses: [cc0, pixabay, royalty-free, cc-by, public-domain, own]
    avoid_recent: 3

# ---- Phase 4: Shorts/Reels (OpenShorts in Docker, cloned WITHOUT its cloud/ folder) ----
shorts:
  base_url: http://127.0.0.1:8000
  target_clips: 4
  min_seconds: 20
  max_seconds: 55
  auto_hook: true
  captions: true
  max_trailer_share: 0.25    # a Short may be at most this much trailer footage

# ---- Phase 5: packaging ----
package:
  title_options: 5
  ai_voice_note: "Narration: my own voice, recreated with AI voice cloning."   # set "" to drop the line
  hashtags: 3

# ---- Phase 6: publishing (direct to YouTube and Instagram, no third-party service) ----
publish:
  shorts_targets: [youtube, instagram]   # where each Short goes; long videos go to YouTube
  timezone: Asia/Kolkata     # default for schedule times
  min_lead_minutes: 20
  review_port: 8765
  youtube:
    category_id: "24"
    privacy: private         # uploads are private until scheduled or published
    synthetic_media_flag: true   # sets containsSyntheticMedia; set false if the API rejects it
  instagram:
    api_version: v26.0       # Facebook Login flavour of the Instagram API
    thumb_offset_ms: 1500    # cover frame
    share_to_feed: true
