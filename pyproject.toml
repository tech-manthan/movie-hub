[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinekahani"
version = "0.1.0"
description = "Cine Kahani: a local pipeline for movie and series videos"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "pydantic>=2.6", "pyyaml>=6", "httpx>=0.27", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cinekahani = "cinekahani.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cinekahani = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
